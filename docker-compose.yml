version: '3.9'

services:
  hermes:
    container_name: hermes
    image: lamuri/snomed-tools:v1.0.0
    volumes:
      - hades-data:/data
    entrypoint: ["./build-db.sh"]
    depends_on: []
    restart: "no"  # Prevent restart if completed

  hades:
    container_name: hades
    image: lamuri/snomed-tools:v1.0.0
    volumes:
      - hades-data:/data
    ports:
      - "8080:8080"
    depends_on:
      hermes:
        condition: service_completed_successfully  # Hades starts only after Hermes has finished
    restart: unless-stopped
    command: java -jar hades.jar /data/snomed.db 8080

volumes:
  hades-data:
