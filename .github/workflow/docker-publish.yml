name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'  # Trigger when pushing tags like v1.0.0, v2.3.4
  workflow_dispatch:  # Allow manual run

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set tag version (with fallback for manual run)
        id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
          else
            echo "No tag found; defaulting to 'nightly'."
            echo "TAG=nightly" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/snomed-tools:${{ env.TAG }}
            ${{ vars.DOCKER_USERNAME }}/snomed-tools:latest
